<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Trello Timeline Connector</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <script>
    var BASE_URL = 'https://hafizi84.github.io/trello-timeline/';
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      BASE_URL = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/');
    }

    window.TrelloPowerUp.initialize({
      'board-buttons': function(t, options) {
        return [{
          icon: {
            dark: BASE_URL + 'icon-white.svg',
            light: BASE_URL + 'icon-dark.svg'
          },
          text: 'Timeline',
          callback: function(t) {
            return t.board('id', 'name').then(function(board) {
              return t.modal({
                url: './index.html?boardId=' + encodeURIComponent(board.id),
                title: 'Timeline View - ' + board.name,
                fullscreen: true
              });
            });
          }
        }];
      }
    });
  </script>
</body>
</html>
