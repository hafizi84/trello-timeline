<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Trello Timeline Connector</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <script>
    window.TrelloPowerUp.initialize({
      'board-buttons': function(t, options) {
        return [{
          icon: {
            dark: 'https://raw.githubusercontent.com/tabler/tabler-icons/master/icons/outline/chart-bar.svg',
            light: 'https://raw.githubusercontent.com/tabler/tabler-icons/master/icons/outline/chart-bar.svg'
          },
          text: 'Timeline',
          callback: function(t) {
            return t.board('id', 'name').then(function(board) {
              return t.modal({
                url: './index.html?boardId=' + encodeURIComponent(board.id),
                title: 'Timeline View - ' + board.name,
                fullscreen: true
              });
            });
          }
        }];
      }
    });
  </script>
</body>
</html>
