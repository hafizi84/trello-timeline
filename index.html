<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Trello Timeline View</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2.1">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=2.1">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=2.1">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2.1">
  <link rel="shortcut icon" href="favicon.ico?v=2.1">
  <meta name="theme-color" content="#0079BF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3.2">
</head>
<body>
  <div class="app-container">
    <!-- Top Navigation & Control Bar -->
    <header class="top-bar">
      <div class="top-left">
        <a href="./" class="brand" title="Trello Timeline">
          <svg class="trello-icon" viewBox="0 0 24 24" fill="currentColor">
            <rect width="24" height="24" rx="4.5" fill="#0079BF"/>
            <rect x="4" y="4" width="6.5" height="13.5" rx="1.5" fill="#FFFFFF"/>
            <rect x="13.5" y="4" width="6.5" height="8.5" rx="1.5" fill="#FFFFFF"/>
          </svg>
          <span class="brand-title">Timeline</span>
        </a>

        <div class="brand-divider"></div>

        <div class="group-toggle-wrap">
          <span class="control-label">Group by:</span>
          <div class="pill-group" id="groupByPills">
            <button class="pill-btn active" data-group="label">Label</button>
            <button class="pill-btn" data-group="list">Trello List</button>
            <button class="pill-btn" data-group="member">Assignee</button>
          </div>
        </div>
      </div>

      <div class="top-center">
        <div class="nav-date-controls">
          <button id="prevBtn" class="nav-btn" title="Previous period">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <button id="todayBtn" class="today-btn">Today</button>
          <button id="nextBtn" class="nav-btn" title="Next period">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
          <span id="currentDateRange" class="date-range-label">October 2026</span>
        </div>
      </div>

      <div class="top-right">
        <div class="zoom-controls">
          <button class="zoom-btn active" data-zoom="days">Days</button>
          <button class="zoom-btn" data-zoom="weeks">Weeks</button>
        </div>

        <button id="refreshBtn" class="refresh-btn" title="Refresh timeline with latest changes & sync">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          <span>Refresh</span>
        </button>

        <button id="toggleSidebarBtn" class="sidebar-toggle-btn" title="Toggle Labels Sidebar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          <span class="btn-text">Labels</span>
        </button>

        <button id="openUnscheduledBtn" class="secondary-btn" title="View unscheduled tasks">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          <span class="btn-text-full">Unscheduled </span><span class="badge-count">(<span id="unscheduledCount">0</span>)</span>
        </button>

        <button id="addTaskBtn" class="primary-btn" title="Create a new task">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span class="btn-text-full">New Task</span><span class="btn-text-compact">Task</span>
        </button>

        <div class="sync-status" id="syncStatus" title="Trello API Connected">
          <span class="status-dot"></span>
          <span class="status-text">Connected</span>
        </div>
      </div>
    </header>

    <!-- Main Timeline Area -->
    <main class="timeline-wrapper" id="timelineWrapper">
      <!-- Left Column: Row Headers (Milestone, Lists / Members) -->
      <aside class="timeline-sidebar" id="timelineSidebar">
        <div class="sidebar-corner-cell">
          <span id="sidebarHeaderTitle">Labels</span>
        </div>
        <div class="sidebar-rows-container" id="sidebarRows">
          <!-- Dynamically populated rows -->
        </div>
      </aside>

      <!-- Right Area: Scrollable Timeline Grid -->
      <section class="timeline-grid-container" id="timelineScrollContainer">
        <!-- Date Header Row (Mon 5, Tue 6, Wed 7, Thu 8...) -->
        <div class="timeline-header-row" id="timelineHeaderRow">
          <!-- Dynamically rendered day column headers -->
        </div>

        <!-- The Canvas / SVG for Dependency Lines -->
        <svg class="dependency-svg-layer" id="dependencySvgLayer"></svg>

        <!-- Vertical "Today" Marker Line -->
        <div class="today-marker-line" id="todayMarkerLine"></div>

        <!-- Grid Body with Horizontal Rows and Vertical Day Columns -->
        <div class="timeline-grid-body" id="timelineGridBody">
          <!-- Dynamically rendered task rows and cells -->
        </div>
      </section>
    </main>

    <!-- Bottom Drawer: Unscheduled Trello Cards (Drag onto timeline) -->
    <div class="unscheduled-drawer" id="unscheduledDrawer">
      <div class="drawer-header">
        <div class="drawer-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <h3>Unscheduled Cards</h3>
          <span class="drawer-subtitle">Cards without dates. Click any card to schedule for Today / This Week!</span>
        </div>
        <button id="closeDrawerBtn" class="close-btn">&times;</button>
      </div>
      <div class="drawer-cards-list" id="unscheduledCardsList">
        <!-- Cards loaded here -->
      </div>
    </div>

    <!-- Edit Task / Add Task Modal -->
    <div class="modal-overlay" id="taskModalOverlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">Edit Task Details</h3>
          <button id="closeModalBtn" class="close-btn">&times;</button>
        </div>
        <form id="taskForm" class="modal-form">
          <input type="hidden" id="editCardId">
          
          <div class="modal-body-layout" id="modalBodyLayout">
            <!-- Left Column: Task Details & Properties -->
            <div class="modal-body-left">
              <!-- Segmented Type Selector: Task vs Holiday / Leave -->
              <div class="entry-type-selector">
                <label class="entry-type-tab active" id="tabTypeTask">
                  <input type="radio" name="entryType" value="task" id="entryTypeTask" checked>
                  <span>📋 Task</span>
                </label>
                <label class="entry-type-tab" id="tabTypeHoliday">
                  <input type="radio" name="entryType" value="holiday" id="entryTypeHoliday">
                  <span>🌴 Public Holiday / Leave</span>
                </label>
              </div>

              <div class="form-group" id="taskNameGroup">
                <label for="taskName" id="taskNameLabel">Task Name</label>
                <input type="text" id="taskName" required placeholder="e.g. Website design">
              </div>

              <div class="form-group" id="taskDescGroup">
                <label for="taskDesc" id="taskDescLabel">Task Description</label>
                <textarea id="taskDesc" rows="3" placeholder="Add detailed notes, links, or description..."></textarea>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <div class="label-with-action">
                    <label for="taskStartDate">Start Date <span class="date-format-tag">(DD-MM-YYYY)</span></label>
                    <button type="button" class="clear-field-link" id="clearStartDateBtn" title="Clear start date">Clear</button>
                  </div>
                  <input type="date" id="taskStartDate">
                </div>
                <div class="form-group">
                  <div class="label-with-action">
                    <label for="taskDueDate">Due Date <span class="date-format-tag">(DD-MM-YYYY)</span></label>
                    <button type="button" class="clear-field-link" id="clearDueDateBtn" title="Clear due date">Clear</button>
                  </div>
                  <input type="date" id="taskDueDate">
                </div>
              </div>

              <div class="form-row form-row-3" id="taskClassificationRow">
                <div class="form-group">
                  <label for="taskStatus" id="taskStatusLabel">Status</label>
                  <select id="taskStatus" class="select-dropdown">
                    <!-- Status lists populated here -->
                  </select>
                </div>
                <div class="form-group">
                  <label for="taskAssignee" id="taskRowLabel">Label</label>
                  <select id="taskAssignee" class="select-dropdown">
                    <!-- Labels populated here -->
                  </select>
                </div>
                <div class="form-group">
                  <label for="taskColor">Theme / Color</label>
                  <select id="taskColor" class="select-dropdown">
                    <option value="yellow">💛 Warm Yellow</option>
                    <option value="blue">💙 Pastel Blue</option>
                    <option value="orange">🧡 Bright Orange</option>
                    <option value="purple">💜 Soft Purple</option>
                    <option value="green">💚 Mint Green</option>
                    <option value="sky">🩵 Sky Blue</option>
                    <option value="pink">🩷 Rose Pink</option>
                    <option value="lime">🍏 Fresh Lime</option>
                    <option value="milestone">🚩 Red (Milestone)</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Right Column: Checklist Section (Right side of popup) -->
            <div class="modal-body-right" id="modalChecklistSection">
              <div class="checklist-panel-header">
                <div class="checklist-panel-title">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 11 12 14 22 4"></polyline>
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                  </svg>
                  <span id="checklistSectionHeading">Checklist</span>
                </div>
                <div class="checklist-counter-badge" id="checklistCounterBadge">0%</div>
              </div>

              <!-- Progress Bar -->
              <div class="checklist-progress-bar-container">
                <div class="checklist-progress-bar-fill" id="checklistProgressBarFill" style="width: 0%;"></div>
              </div>

              <!-- Checklist Items List -->
              <div class="checklist-items-list" id="checklistItemsList">
                <!-- Dynamically populated checklist items -->
              </div>

              <!-- Add Item Form -->
              <div class="checklist-add-form" id="checklistAddForm">
                <div class="checklist-add-input-row">
                  <input type="text" id="newCheckItemInput" placeholder="Add an item..." autocomplete="off">
                  <button type="button" id="addCheckItemBtn" class="checklist-add-btn">Add</button>
                </div>
              </div>
            </div>
          </div>

          <div class="modal-actions">
            <div class="modal-actions-left">
              <button type="button" id="completeTaskBtn" class="complete-btn" title="Mark card as completed on Trello and move to Task Completed (2026-2027)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                <span>Task Completed</span>
              </button>
              <button type="button" id="unscheduleTaskBtn" class="unschedule-btn" title="Clear dates and remove task from timeline to Unscheduled drawer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
                <span>Unschedule</span>
              </button>
              <button type="button" id="archiveTaskBtn" class="archive-btn" title="Archive this card on Trello and remove from timeline">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>
                <span>Archive</span>
              </button>
              <button type="button" id="deleteHolidayBtn" class="archive-btn" style="display:none;" title="Delete this holiday from timeline and Trello">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                <span>Delete Holiday</span>
              </button>
            </div>
            <div class="modal-actions-right">
              <button type="button" id="cancelModalBtn" class="secondary-btn">Cancel</button>
              <button type="submit" id="saveTaskBtn" class="primary-btn">Save & Sync to Trello</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js?v=3.1"></script>
</body>
</html>
